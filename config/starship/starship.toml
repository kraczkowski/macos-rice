# Starship prompt — Sunset Ember palette
# The colours are named in theme.ini.
# Docs: https://starship.rs/config/

format = """
[](ember)\
$os\
$directory\
[](fg:ember)\
$git_branch\
$git_status\
$nodejs\
$python\
$rust """

palette = "sunset_ember"

[palettes.sunset_ember]
base    = "#{{base}}"   # dark teal base
text    = "#{{text}}"   # warm white
ember   = "#{{ember}}"   # ember accent  — prompt pill (os + directory)
oxide   = "#{{oxide}}"   # oxidized iron — git
sand    = "#{{sand}}"   # warm sand     — languages
surface = "#{{surface}}"   # dark teal surface
red     = "#{{ember}}"   # error

[os]
disabled = false
style = "bg:surface fg:ember"
format = "[ $symbol]($style)"

[os.symbols]
Macos = "󰀵 "

[directory]
style = "bg:surface fg:text"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "fg:oxide"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "fg:oxide"
format = '[$all_status$ahead_behind ]($style)'

[nodejs]
symbol = ""
style = "fg:sand"
format = '[ $symbol ]($style)'

[python]
symbol = ""
style = "fg:sand"
format = '[ $symbol ]($style)'

[rust]
symbol = ""
style = "fg:sand"
format = '[ $symbol ]($style)'
