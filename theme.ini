# Sunset Ember — dark teal and sunset reds.
#
# The one place a colour, the font or the glass effect is typed. A file under config/ names a
# value instead of typing it: {{ember}} for b33219, {{ember|rgb}} for 179;50;25.
# After a change here:  bin/apply

[look]
font    = JetBrainsMono Nerd Font
opacity = 0.2      # how see-through a window's background is (0 = clear glass, 1 = solid)
blur    = 32       # how much what lies behind a window is blurred

[ground]
base     = 0a1618  # dark teal: every background
surface  = 162930  # one step lighter: pills, status lines, idle dots, unfocused borders
line     = 2a3f44  # dividers
black    = 030602  # terminal black
plum     = 38252a  # terminal bright black

[text]
text     = e8d5c2  # warm white
cream    = f2e6d8  # terminal bright white
linen    = d9c0ae  # icons in the bar
sand     = c9a892  # secondary text, axis ticks
muted    = 7a6a5e  # comments, shell suggestions
faint    = 4a3f3a  # line numbers, plot edges
slate    = 5c6b6e  # disabled text

[reds]
ember    = b33219  # the accent: focus, cursor, prompt, alerts
flame    = d6492b  # its bright form: keywords, first plot line
oxide    = a5311a  # second accent: git, box outlines
wine     = 5c1416  # where a gradient starts
mahogany = 481510  # selections
berry    = 9c3b4a  # terminal magenta
rose     = b9576a  # terminal bright magenta: constants
rust     = 6e3a26  # the logo's fifth stripe

[golds]
amber    = d9853f  # terminal yellow: numbers
gold     = e8a04f  # terminal bright yellow: strings, and where a gradient ends
orange   = e0651f  # where a hot gradient ends
copper   = b3651f  # the middle of the gold gradient

[greens]
moss     = 6e7a52  # terminal green
olive    = 8a9560  # terminal bright green

[teals]
ocean    = 3e7a85  # terminal blue
steel    = 4f93a0  # terminal bright blue
teal     = 4f9aa5  # terminal cyan: types
sky      = 6bb3bd  # terminal bright cyan: functions
pine     = 3d5a5e  # the middle of the cool gradient
mist     = 7fa3a0  # where the cool gradient ends
